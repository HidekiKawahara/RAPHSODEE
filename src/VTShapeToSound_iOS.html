      /* Top Navigation Bar & Tabs */
      .top-bar {
        width: 1080px; background: #2b2b2b; color: #fff;
        display: flex; align-items: center; justify-content: space-between;
        padding: 6px 14px; border-radius: 6px 6px 0 0; margin-top: 8px;

      .tab-bar { display: flex; gap: 6px; }
      .tab-btn {
        background: #444; color: #ddd; border: none;
        padding: 6px 16px; font-size: 13px; font-weight: 600;
        border-radius: 4px; cursor: pointer; transition: 0.15s;
      }
      .tab-btn:hover { background: #555; color: #fff; }
      .tab-btn.active { background: #0078d4; color: #fff; }
      
      /* Application Container matching MATLAB pixel dimensions */
      .workspace {
        width: 1080px; height: 675px;
        background: var(--bg-main);
        border: 1px solid #999; border-top: none;
        border-radius: 0 0 6px 6px;
        position: relative; overflow: hidden;
        box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      }
      .tab-pane {
        width: 100%; height: 100%;
        position: absolute; top: 0; left: 0;
        display: none;
      }
      .tab-pane.active { display: block; }
      
      /* Absolute UI Controls matching MATLAB App Designer */
      canvas {
        position: absolute;
        background: #ffffff;
        z-index: 1;
        touch-action: none;
      }
      canvas.bg-gray { background: var(--bg-main); }
      
      .ui-btn {
        position: absolute;
        background: linear-gradient(to bottom, #ffffff 0%, #e2e2e2 100%);
        border: 1px solid #8c8c8c; border-radius: 3px;
        color: #111; font-size: 12px; font-weight: 500;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        padding: 0 4px;
        box-shadow: 0 1px 1px rgba(0,0,0,0.08);
        z-index: 10;
      }
      .ui-btn:hover:not(:disabled) {
        background: linear-gradient(to bottom, #f8fbff 0%, #d4e4f7 100%);
        border-color: #005a9e;
      }
      .ui-btn:active:not(:disabled) {
        background: #c8dcf0;
      }
      .ui-btn:disabled {
        opacity: 0.48; cursor: not-allowed;
      }
      .ui-panel {
        position: absolute;
        background: var(--bg-main);
        border: 1px solid var(--border-col);
        border-radius: 3px;
        z-index: 10;
      }
      .ui-panel-title {
        position: absolute; top: -9px; left: 7px;
        background: var(--bg-main); padding: 0 4px;
        font-size: 11.5px; font-weight: 600; color: #222;
      }
      .ui-label {
        position: absolute;
        font-size: 12px; color: #111;
        display: flex; align-items: center;
        white-space: nowrap;
        z-index: 10;
      }
      .ui-input, .ui-select {

    <script>
      "use strict";
      
      /* ============================================================================
 * 0. SHARED AUDIO CONTEXT, FILE SYSTEM PICKERS & DSP UTILITIES (Float64Array)
 * ============================================================================ */
      let sharedAudioCtx = null;
      function getAudioContext() {
        if (!sharedAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          try {
            sharedAudioCtx = new AudioCtx({ sampleRate: 44100 });
          } catch (e) {
            sharedAudioCtx = new AudioCtx();
          }
        }
        if (sharedAudioCtx.state === "suspended") {
          sharedAudioCtx.resume();
        }
        return sharedAudioCtx;
      }
      
      class DSPUtils {
        // In-place Radix-2 Cooley-Tukey FFT (Float64Array re, im).
        static fft(re, im, invert = false) {
          const n = re.length;
          let j = 0;
          for (let i = 1; i < n; i++) {
            let bit = n >> 1;
            while (j & bit) { j ^= bit; bit >>= 1; }
            j ^= bit;
            if (i < j) {
              let tr = re[i]; re[i] = re[j]; re[j] = tr;
              let ti = im[i]; im[i] = im[j]; im[j] = ti;
            }
          }
          for (let len = 2; len <= n; len <<= 1) {
            const ang = 2 * Math.PI / len * (invert ? 1 : -1);
            const wlenRe = Math.cos(ang);
            const wlenIm = Math.sin(ang);
            const half = len >> 1;
            for (let i = 0; i < n; i += len) {
              let wRe = 1.0, wIm = 0.0;
              for (let k = 0; k < half; k++) {
                const uRe = re[i + k], uIm = im[i + k];
                const vRe = re[i + k + half] * wRe - im[i + k + half] * wIm;
                const vIm = re[i + k + half] * wIm + im[i + k + half] * wRe;
                re[i + k] = uRe + vRe;
                im[i + k] = uIm + vIm;
                re[i + k + half] = uRe - vRe;
                im[i + k + half] = uIm - vIm;
                const nextWRe = wRe * wlenRe - wIm * wlenIm;
                wIm = wRe * wlenIm + wIm * wlenRe;
                wRe = nextWRe;
              }
            }
          }
          if (invert) {
            for (let i = 0; i < n; i++) {
              re[i] /= n;
              im[i] /= n;
            }
          }
        }
        
        // Direct Form II Transposed IIR/FIR digital filter matching MATLAB filter(b, a, x)
        static filter(b, a, x) {
          const N = x.length;
          const out = new Float64Array(N);
          const nb = b.length, na = a.length;
          const nOrder = Math.max(nb, na);
          const a0 = a[0];
          const bNorm = new Float64Array(nOrder);
          const aNorm = new Float64Array(nOrder);
          for (let i = 0; i < nb; i++) bNorm[i] = b[i] / a0;
          for (let i = 0; i < na; i++) aNorm[i] = a[i] / a0;
          const z = new Float64Array(nOrder);
          for (let n = 0; n < N; n++) {
            const xn = x[n];
            const yn = bNorm[0] * xn + z[0];
            out[n] = yn;
            for (let i = 1; i < nOrder; i++) {
              z[i - 1] = bNorm[i] * xn + z[i] - aNorm[i] * yn;
            }
          }
          return out;
        }
        
        static fftfilt(h, x) {
          return DSPUtils.filter(h, [1.0], x);
        }
        
        static interp1(xArr, yArr, xiArr) {
          const n = xArr.length;
          const m = xiArr.length;
          const out = new Float64Array(m);
          if (n < 2) {
            out.fill(n === 1 ? yArr[0] : 0);
            return out;
          }
          for (let i = 0; i < m; i++) {
            const xi = xiArr[i];
            if (xi <= xArr[0]) {
              const dx = xArr[1] - xArr[0];
              const slope = Math.abs(dx) > 1e-15 ? (yArr[1] - yArr[0]) / dx : 0;
              out[i] = yArr[0] + (xi - xArr[0]) * slope;
            } else if (xi >= xArr[n - 1]) {
              const dx = xArr[n - 1] - xArr[n - 2];
              const slope = Math.abs(dx) > 1e-15 ? (yArr[n - 1] - yArr[n - 2]) / dx : 0;
              out[i] = yArr[n - 1] + (xi - xArr[n - 1]) * slope;
            } else {
              let lo = 0, hi = n - 1;
              while (hi - lo > 1) {
                const mid = (lo + hi) >> 1;
                if (xArr[mid] <= xi) lo = mid; else hi = mid;
              }
              const dx = xArr[hi] - xArr[lo];
              const t = Math.abs(dx) > 1e-15 ? (xi - xArr[lo]) / dx : 0;
              out[i] = yArr[lo] + t * (yArr[hi] - yArr[lo]);
            }
          }
          return out;
        }
        
        static interp1Scalar(xArr, yArr, xi) {
          return DSPUtils.interp1(xArr, yArr, [xi])[0];
        }
        
        static fzero(fun, x0) {
          let x = x0;
          let fx = fun(x);
          if (Math.abs(fx) < 1e-13) return x;
          let dx = Math.abs(x0) > 1e-4 ? x0 * 0.02 : 0.01;
          let xPrev = x - dx;
          let fPrev = fun(xPrev);
          for (let iter = 0; iter < 80; iter++) {
            const df = fx - fPrev;
            let xNext;
            if (Math.abs(df) > 1e-15) {
              xNext = x - fx * (x - xPrev) / df;
            } else {
              xNext = x + dx;
            }
            const maxStep = Math.max(Math.abs(x) * 2.0, 5.0);
            if (Math.abs(xNext - x) > maxStep) {
              xNext = x + Math.sign(xNext - x) * maxStep;
            }
            xPrev = x;
            fPrev = fx;
            x = xNext;
            fx = fun(x);
            if (Math.abs(fx) < 1e-12 || Math.abs(x - xPrev) < 1e-11) break;
          }
          return x;
        }
        
        static levinson(r) {
          const p = r.length - 1;
          let a = new Float64Array(p + 1);
          let aPrev = new Float64Array(p + 1);
          a[0] = 1.0;
          let E = r[0];
          if (Math.abs(E) < 1e-15) return a;
          for (let m = 1; m <= p; m++) {
            let sum = r[m];
            for (let k = 1; k < m; k++) sum += a[k] * r[m - k];
            const km = -sum / E;
            aPrev.set(a);
            a[m] = km;
            for (let k = 1; k < m; k++) {
              a[k] = aPrev[k] + km * aPrev[m - k];
            }
            E *= (1.0 - km * km);
            if (E <= 1e-15) break;
          }
          return a;
        }
        
        static playSignal(samples, fs = 44100) {
          const ctx = getAudioContext();
          if (DSPUtils.currentSourceNode) {
            try { DSPUtils.currentSourceNode.stop(); } catch (e) {}
            DSPUtils.currentSourceNode = null;
          }
          const buf = ctx.createBuffer(1, samples.length, fs);
          const ch = buf.getChannelData(0);
          for (let i = 0; i < samples.length; i++) ch[i] = samples[i];
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start();
          DSPUtils.currentSourceNode = src;
          return src;
        }
        
        // Encode monaural 24-bit PCM WAV Blob
        static encodeWAV24Bit(samples, fs = 44100) {
          const numSamples = samples.length;
          const bytesPerSample = 3; // 24-bit PCM
          const dataSize = numSamples * bytesPerSample;
          const buffer = new ArrayBuffer(44 + dataSize);
          const view = new DataView(buffer);
          
          const writeStr = (offset, str) => {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
          };
          
          writeStr(0, "RIFF");
          view.setUint32(4, 36 + dataSize, true);
          writeStr(8, "WAVE");
          writeStr(12, "fmt ");
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true);
          view.setUint16(22, 1, true);
          view.setUint32(24, Math.round(fs), true);
          view.setUint32(28, Math.round(fs) * bytesPerSample, true);
          view.setUint16(32, bytesPerSample, true);
          view.setUint16(34, 24, true);
          writeStr(36, "data");
          view.setUint32(40, dataSize, true);
          
          let offset = 44;
          for (let i = 0; i < numSamples; i++) {
            let s = Math.max(-1.0, Math.min(1.0, samples[i]));
            let intVal = Math.round(s < 0 ? s * 8388608 : s * 8388607);
            if (intVal < 0) intVal += 16777216;
            view.setUint8(offset, intVal & 0xFF);
            view.setUint8(offset + 1, (intVal >> 8) & 0xFF);
            view.setUint8(offset + 2, (intVal >> 16) & 0xFF);
            offset += 3;
          }
          return new Blob([buffer], { type: "audio/wav" });
        }
        
        static triggerDownload(blob, filename) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
          }, 250);
        }
        
        // Save a single file with native directory/filename picker (showSaveFilePicker)
        static async saveSingleFileWithDialog(blob, suggestedName, description, mimeType, ext) {
          if (window.showSaveFilePicker) {
            try {
              const opts = {
                suggestedName,
                types: [{ description, accept: { [mimeType]: [ext] } }]
              };
              if (DSPUtils.lastDirHandle) opts.startIn = DSPUtils.lastDirHandle;
              const handle = await window.showSaveFilePicker(opts);
              const writable = await handle.createWritable();
              await writable.write(blob);
              await writable.close();
              return true;
            } catch (err) {
              if (err.name === "AbortError") return false;
            }
          }
          // Fallback for browsers without showSaveFilePicker (e.g. Safari)
          const customName = window.prompt("Enter file name to save:", suggestedName);
          if (!customName) return false;
          const finalName = customName.endsWith(ext) ? customName : (customName + ext);
          DSPUtils.triggerDownload(blob, finalName);
          return true;
        }
        
        // Save multiple files (.wav, .txt, .json) into a user-selected directory
        static async saveBundleToDirectory(defaultBaseName, fileItems) {
          // Method 1: Native Directory Picker (Chrome / Edge)
          if (window.showDirectoryPicker) {
            try {
              const dirOpts = { mode: "readwrite" };
              if (DSPUtils.lastDirHandle) dirOpts.startIn = DSPUtils.lastDirHandle;
              const dirHandle = await window.showDirectoryPicker(dirOpts);
              DSPUtils.lastDirHandle = dirHandle;
              
              const baseNameInput = window.prompt(
                `Selected folder: "${dirHandle.name}"\nEnter base file name for (${fileItems.map(f => f.ext).join(", ")}):`,
                defaultBaseName
              );
              if (!baseNameInput) return false;
              const cleanBase = baseNameInput.replace(/\.(wav|txt|json|mat)$/i, "").trim() || defaultBaseName;
              
              for (const item of fileItems) {
                const fileHandle = await dirHandle.getFileHandle(cleanBase + item.ext, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(item.blob);
                await writable.close();
              }
              return true;
            } catch (err) {
              if (err.name === "AbortError") return false;
            }
          }
          
          // Method 2: Sequential showSaveFilePicker if showDirectoryPicker is unavailable
          if (window.showSaveFilePicker) {
            try {
              let cleanBase = defaultBaseName;
              for (let i = 0; i < fileItems.length; i++) {
                const item = fileItems[i];
                const handle = await window.showSaveFilePicker({
                    suggestedName: cleanBase + item.ext,
                    types: [{ description: item.description, accept: { [item.mime]: [item.ext] } }]
                });
                if (i === 0 && handle.name) {
                  cleanBase = handle.name.replace(/\.(wav|txt|json|mat)$/i, "");
                }
                const writable = await handle.createWritable();
                await writable.write(item.blob);
                await writable.close();
              }
              return true;
            } catch (err) {
              if (err.name === "AbortError") return false;
            }
          }
          
          // Method 3: Fallback for Safari
          const baseNameInput = window.prompt(
            `Enter base file name to save (${fileItems.map(f => f.ext).join(", ")}):`,
            defaultBaseName
          );
          if (!baseNameInput) return false;
          const cleanBase = baseNameInput.replace(/\.(wav|txt|json|mat)$/i, "").trim() || defaultBaseName;
          for (const item of fileItems) {
            DSPUtils.triggerDownload(item.blob, cleanBase + item.ext);
          }
          return true;
        }
        
        static timestampStr() {
          const d = new Date();
          const pad = (n) => String(n).padStart(2, "0");
          return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
        }
      }
      DSPUtils.lastDirHandle = null;
      DSPUtils.currentSourceNode = null;
      
      /* ============================================================================
 * 1. CLASS 1: VocalTractModel (Domain Math, Aberth-Ehrlich Roots, LSF, STFT)
 * ============================================================================ */
      class VocalTractModel {
        static getPresetLFParameters(presetName = "modal") {
          let p;
          switch (presetName.trim().toLowerCase()) {
            case "modal": p = VocalTractModel.ModalPreset; break;
            case "fry":
            case "vocal fry": p = VocalTractModel.FryPreset; break;
            case "breathy": p = VocalTractModel.BreathyPreset; break;
            case "blended":
            p = [0, 1, 2, 3].map(i =>
              0.4 * VocalTractModel.ModalPreset[i] +
              0.3 * VocalTractModel.BreathyPreset[i] +
              0.3 * VocalTractModel.FryPreset[i]
            );
            break;
            default: p = VocalTractModel.ModalPreset;
          }
          return { tp: p[0], te: p[1], ta: p[2], tc: p[3] };
        }
        
        static areaToReflection(areaVector) {
          const n = areaVector.length - 1;
          const k = new Float64Array(n);
          for (let i = 0; i < n; i++) {
            const denom = Math.max(areaVector[i + 1] + areaVector[i], 2.220446049250313e-16);
            k[i] = (areaVector[i + 1] - areaVector[i]) / denom;
          }
          return k;
        }
        
        static reflectionToArea(k) {
          const n = k.length;
          const areaVector = new Float64Array(n + 1);
          areaVector.fill(1.0);
          for (let i = n - 1; i >= 0; i--) {
            areaVector[i] = areaVector[i + 1] * (1.0 - k[i]) / Math.max(1.0 + k[i], 1e-6);
          }
          return areaVector;
        }
        
        static reflectionToLpc(k) {
          const n = k.length;
          let a = new Float64Array(n);
          let b = new Float64Array(n);
          a[0] = k[0];
          for (let ii = 1; ii < n; ii++) {
            for (let jj = 0; jj < ii; jj++) {
              b[jj] = a[jj] - k[ii] * a[ii - 1 - jj];
            }
            a.set(b);
            a[ii] = k[ii];
          }
          const alp = new Float64Array(n + 1);
          alp[0] = 1.0;
          for (let i = 0; i < n; i++) alp[i + 1] = -a[i];
          return alp;
        }
        
        static lpcToReflection(alp) {
          const n = alp.length - 1;
          let a = new Float64Array(n);
          let b = new Float64Array(n);
          for (let i = 0; i < n; i++) a[i] = -alp[i + 1];
          const k = new Float64Array(n);
          for (let ii = n - 1; ii >= 0; ii--) {
            k[ii] = Math.max(-0.995, Math.min(0.995, a[ii]));
            const denom = Math.max(1.0 - k[ii] * k[ii], 1e-6);
            for (let jj = 0; jj < ii; jj++) {
              b[jj] = (a[jj] + k[ii] * a[ii - 1 - jj]) / denom;
            }
            a.set(b);
          }
          return k;
        }
        
        static computeTransferFunction(logArea, fs = 44100, fftl = 4096) {
          const area = new Float64Array(logArea.length);
          for (let i = 0; i < logArea.length; i++) area[i] = Math.exp(logArea[i]);
          const k = VocalTractModel.areaToReflection(area);
          const alp = VocalTractModel.reflectionToLpc(k);
          
          const re = new Float64Array(fftl);
          const im = new Float64Array(fftl);
          for (let i = 0; i < alp.length; i++) re[i] = alp[i];
          DSPUtils.fft(re, im, false);
          
          const gaindB = new Float64Array(fftl);
          const fx = new Float64Array(fftl);
          const dcGain = -10.0 * Math.log10(re[0] * re[0] + im[0] * im[0] + 1e-30);
          for (let i = 0; i < fftl; i++) {
            const magSq = re[i] * re[i] + im[i] * im[i];
            gaindB[i] = -10.0 * Math.log10(Math.max(magSq, 1e-30)) - dcGain;
            fx[i] = (i / fftl) * fs;
          }
          return { gaindB, fx, alp };
        }
        
        static predictorToAreaAndGain(alp, fs = 44100, fftl = 4096) {
          const re = new Float64Array(fftl);
          const im = new Float64Array(fftl);
          for (let i = 0; i < alp.length; i++) re[i] = alp[i];
          DSPUtils.fft(re, im, false);
          
          const gaindB = new Float64Array(fftl);
          const fx = new Float64Array(fftl);
          const dcGain = -10.0 * Math.log10(re[0] * re[0] + im[0] * im[0] + 1e-30);
          for (let i = 0; i < fftl; i++) {
            const magSq = re[i] * re[i] + im[i] * im[i];
            gaindB[i] = -10.0 * Math.log10(Math.max(magSq, 1e-30)) - dcGain;
            fx[i] = (i / fftl) * fs;
          }
          const k = VocalTractModel.lpcToReflection(alp);
          const area = VocalTractModel.reflectionToArea(k);
          const logArea = new Float64Array(area.length);
          for (let i = 0; i < area.length; i++) {
            logArea[i] = Math.log(Math.max(area[i], 2.220446049250313e-16));
          }
          return { gaindB, fx, logArea };
        }
        
        // Aberth-Ehrlich simultaneous polynomial root finder in Float64Array
        static polyRootsAberth(alp) {
          let n = alp.length - 1;
          while (n > 0 && Math.abs(alp[n]) < 1e-14) n--;
          if (n <= 0) return { re: new Float64Array(0), im: new Float64Array(0) };
          
          const c = new Float64Array(n + 1);
          const a0 = alp[0];
          for (let i = 0; i <= n; i++) c[i] = alp[i] / a0;
          
          const zRe = new Float64Array(n);
          const zIm = new Float64Array(n);
          for (let k = 0; k < n; k++) {
            const r = 0.88 + 0.04 * Math.cos(k * 1.7);
            const theta = (2.0 * Math.PI * (k + 0.35)) / n;
            zRe[k] = r * Math.cos(theta);
            zIm[k] = r * Math.sin(theta);
          }
          
          const maxIter = 45;
          for (let iter = 0; iter < maxIter; iter++) {
            let maxDelta = 0.0;
            for (let i = 0; i < n; i++) {
              const x = zRe[i], y = zIm[i];
              let pRe = c[0], pIm = 0.0;
              let dpRe = 0.0, dpIm = 0.0;
              for (let k = 1; k <= n; k++) {
                const nextDpRe = dpRe * x - dpIm * y + pRe;
                const nextDpIm = dpRe * y + dpIm * x + pIm;
                dpRe = nextDpRe; dpIm = nextDpIm;
                const nextPRe = pRe * x - pIm * y + c[k];
                const nextPIm = pRe * y + pIm * x;
                pRe = nextPRe; pIm = nextPIm;
              }
              const pMag = Math.hypot(pRe, pIm);
              if (pMag < 1e-14) continue;
              
              const dpMagSq = dpRe * dpRe + dpIm * dpIm;
              if (dpMagSq < 1e-28) continue;
              const wRe = (pRe * dpRe + pIm * dpIm) / dpMagSq;
              const wIm = (pIm * dpRe - pRe * dpIm) / dpMagSq;
              
              let sumRe = 0.0, sumIm = 0.0;
              for (let j = 0; j < n; j++) {
                if (i === j) continue;
                const dx = x - zRe[j], dy = y - zIm[j];
                const dSq = dx * dx + dy * dy;
                if (dSq > 1e-24) {
                  sumRe += dx / dSq;
                  sumIm -= dy / dSq;
                }
              }
              const denRe = 1.0 - (wRe * sumRe - wIm * sumIm);
              const denIm = -(wRe * sumIm + wIm * sumRe);
              const denSq = denRe * denRe + denIm * denIm;
              if (denSq < 1e-28) continue;
              
              const dRe = (wRe * denRe + wIm * denIm) / denSq;
              const dIm = (wIm * denRe - wRe * denIm) / denSq;
              zRe[i] -= dRe;
              zIm[i] -= dIm;
              const delta = Math.hypot(dRe, dIm);
              if (delta > maxDelta) maxDelta = delta;
            }
            if (maxDelta < 1e-11) break;
          }
          return { re: zRe, im: zIm };
        }
        
        static polyFromRoots(zRe, zIm) {
          const n = zRe.length;
          let cRe = new Float64Array(n + 1);
          let cIm = new Float64Array(n + 1);
          cRe[0] = 1.0;
          for (let i = 0; i < n; i++) {
            const rRe = zRe[i], rIm = zIm[i];
            for (let k = i + 1; k >= 1; k--) {
              const prodRe = cRe[k - 1] * rRe - cIm[k - 1] * rIm;
              const prodIm = cRe[k - 1] * rIm + cIm[k - 1] * rRe;
              cRe[k] -= prodRe;
              cIm[k] -= prodIm;
            }
          }
          return cRe;
        }
        
        static computeFormantRoots(logArea, fs = 44100) {
          const area = new Float64Array(logArea.length);
          for (let i = 0; i < logArea.length; i++) area[i] = Math.exp(logArea[i]);
          const k = VocalTractModel.areaToReflection(area);
          let allSmall = true;
          for (let i = 0; i < k.length; i++) {
            if (Math.abs(k[i]) >= 1e-7) { allSmall = false; break; }
          }
          if (allSmall) {
            return {
              freqs: new Float64Array([500, 1500, 2500, 3500, 4500]),
              bws:   new Float64Array([1200, 1400, 1300, 1200, 1500]),
              zRe:   new Float64Array(0),
              zIm:   new Float64Array(0)
            };
          }
          const alp = VocalTractModel.reflectionToLpc(k);
          const { re, im } = VocalTractModel.polyRootsAberth(alp);
          const n = re.length;
          const freqs = new Float64Array(n);
          const bws   = new Float64Array(n);
          for (let i = 0; i < n; i++) {
            const magR = Math.max(Math.hypot(re[i], im[i]), 1e-6);
            const ang  = Math.atan2(im[i], re[i]);
            freqs[i]   = (ang / Math.PI) * (fs / 2.0);
            bws[i]     = Math.max(1.0, (-Math.log(magR) / Math.PI) * fs);
          }
          return { freqs, bws, zRe: re, zIm: im };
        }
        
        static computeLSF(logArea, fs = 44100) {
          const nSection = logArea.length - 1;
          const area = new Float64Array(logArea.length);
          for (let i = 0; i < logArea.length; i++) area[i] = Math.exp(logArea[i]);
          const k = VocalTractModel.areaToReflection(area);
          let allSmall = true;
          for (let i = 0; i < k.length; i++) {
            if (Math.abs(k[i]) >= 1e-7) { allSmall = false; break; }
          }
          if (allSmall) {
            const fallback = new Float64Array(nSection);
            for (let i = 0; i < nSection; i++) fallback[i] = ((i + 0.5) / nSection) * (fs / 2.0);
            return fallback;
          }
          
          const alp = VocalTractModel.reflectionToLpc(k);
          const p = alp.length - 1;
          const P = new Float64Array(p + 2);
          const Q = new Float64Array(p + 2);
          P[0] = 1.0; Q[0] = 1.0;
          for (let i = 1; i <= p; i++) {
            P[i] = alp[i] + alp[p + 1 - i];
            Q[i] = alp[i] - alp[p + 1 - i];
          }
          P[p + 1] = 1.0;
          Q[p + 1] = -1.0;
          
          const evalSym = (poly, isAntiSym, omega) => {
            let sum = 0.0;
            const len = poly.length;
            const mid = (len - 1) / 2.0;
            for (let idx = 0; idx < Math.floor(len / 2); idx++) {
              const order = mid - idx;
              sum += poly[idx] * (isAntiSym ? Math.sin(order * omega) : Math.cos(order * omega));
            }
            if (!isAntiSym && (len % 2 === 1)) {
              sum += 0.5 * poly[Math.floor(len / 2)];
            }
            return sum;
          };
          
          const nGrid = 1024;
          const rootsOmega = [];
          let prevP = evalSym(P, false, 1e-5);
          let prevQ = evalSym(Q, true, 1e-5);
          let prevW = 1e-5;
          
          for (let g = 1; g < nGrid; g++) {
            const w = (g / nGrid) * Math.PI;
            const curP = evalSym(P, false, w);
            const curQ = evalSym(Q, true, w);
            
            if (prevP * curP <= 0) {
              let a = prevW, b = w, fa = prevP;
              for (let it = 0; it < 12; it++) {
                const m = 0.5 * (a + b);
                const fm = evalSym(P, false, m);
                if (fa * fm <= 0) b = m; else { a = m; fa = fm; }
              }
              rootsOmega.push(0.5 * (a + b));
            }
            if (prevQ * curQ <= 0) {
              let a = prevW, b = w, fa = prevQ;
              for (let it = 0; it < 12; it++) {
                const m = 0.5 * (a + b);
                const fm = evalSym(Q, true, m);
                if (fa * fm <= 0) b = m; else { a = m; fa = fm; }
              }
              rootsOmega.push(0.5 * (a + b));
            }
            prevP = curP; prevQ = curQ; prevW = w;
          }
          
          rootsOmega.sort((a, b) => a - b);
          const out = new Float64Array(Math.min(nSection, rootsOmega.length));
          for (let i = 0; i < out.length; i++) {
            out[i] = (rootsOmega[i] / (2.0 * Math.PI)) * fs;
          }
          return out;
        }
        
        static createFourierModifierBasis(xSectionCm) {
          const N = xSectionCm.length;
          const xRef = xSectionCm[N - 2];
          const basisMatrix = Array.from({ length: 7 }, () => new Float64Array(N));
          for (let r = 0; r < N; r++) {
            const xBase = (xSectionCm[r] / xRef) * Math.PI;
            for (let ii = 1; ii <= 3; ii++) {
              basisMatrix[(ii - 1) * 2][r]     = Math.sin(ii * xBase);
              basisMatrix[(ii - 1) * 2 + 1][r] = Math.cos(ii * xBase);
            }
            basisMatrix[6][r] = 1.0;
          }
          const ratios = [1/2, 0, 1/4, 1, 1/6, 2/3, 3/4];
          const anchorPositions = ratios.map(v => v * xRef);
          return { basisMatrix, anchorPositions };
        }
        
        static nuttallwin12(N) {
          if (N <= 1) return new Float64Array([1.0]);
          const w = new Float64Array(N);
          const b0 = 0.355768, b1 = -0.487396, b2 = 0.144232, b3 = -0.012604;
          const scale = (2.0 * Math.PI) / (N - 1);
          for (let i = 0; i < N; i++) {
            const x = i * scale;
            w[i] = b0 + b1 * Math.cos(x) + b2 * Math.cos(2 * x) + b3 * Math.cos(3 * x);
          }
          return w;
        }
        
        static stftSpectrogramStructure(x, fs, windowLengthInms, windowShiftInms) {
          const halfWin = Math.round((windowLengthInms / 1000.0) * fs / 2.0);
          const winLen = 2 * halfWin + 1;
          const w = VocalTractModel.nuttallwin12(winLen);
          const shiftSec = windowShiftInms / 1000.0;
          const maxTime = (x.length - 1) / fs;
          const temporalLocations = [];
          for (let t = 0; t <= maxTime + 1e-9; t += shiftSec) temporalLocations.push(t);
          
          const fftl = Math.pow(2, Math.ceil(Math.log2(halfWin) + 2));
          const nBins = (fftl >> 1) + 1;
          const nFrames = temporalLocations.length;
          
          const rawSgram = Array.from({ length: nFrames }, () => new Float64Array(nBins));
          let maxPower = 0.0;
          const re = new Float64Array(fftl);
          const im = new Float64Array(fftl);
          
          for (let f = 0; f < nFrames; f++) {
            const centerSample = Math.round(temporalLocations[f] * fs);
            re.fill(0); im.fill(0);
            for (let k = -halfWin; k <= halfWin; k++) {
              const idx = Math.min(Math.max(0, centerSample + k), x.length - 1);
              re[k + halfWin] = x[idx] * w[k + halfWin];
            }
            DSPUtils.fft(re, im, false);
            const col = rawSgram[f];
            for (let b = 0; b < nBins; b++) {
              const p = re[b] * re[b] + im[b] * im[b];
              col[b] = p;
              if (p > maxPower) maxPower = p;
            }
          }
          
          const dBspectrogram = Array.from({ length: nFrames }, () => new Float64Array(nBins));
          const denom = Math.max(maxPower, 1e-30);
          for (let f = 0; f < nFrames; f++) {
            for (let b = 0; b < nBins; b++) {
              dBspectrogram[f][b] = 10.0 * Math.log10(rawSgram[f][b] / denom + 1e-13);
            }
          }
          
          const frequencyAxis = new Float64Array(nBins);
          for (let b = 0; b < nBins; b++) frequencyAxis[b] = (b / fftl) * fs;
          
          return { dBspectrogram, frequencyAxis, temporalPositions: temporalLocations, samplingFrequency: fs };
        }
        
        static formatAreaTxt(vtl, xLocationCm, logArea) {
          const nSec = xLocationCm.length - 1;
          let lines = [];
          lines.push(`Number of sections: ${String(nSec).padStart(4, " ")}`);
          lines.push(`Vocal tract length: ${vtl.toFixed(4).padStart(7, " ")}`);
          lines.push(`List of relative area from lip to glottis`);
          for (let i = 0; i < nSec; i++) {
            lines.push(Math.exp(logArea[i]).toFixed(2).padStart(8, " "));
          }
          return lines.join("\n") + "\n";
        }
        
        static parseVocalTractFile(text, ext, targetLength, defaultVTL) {
          const logArea = new Float64Array(targetLength);
          let vtl = defaultVTL;
          let lfParams = null;
          
          if (ext === "json") {
            const obj = JSON.parse(text);
            if (obj.vtLength) vtl = Number(obj.vtLength);
            if (obj.LFparameters) lfParams = obj.LFparameters;
            if (Array.isArray(obj.finalAreaFunction)) {
              const af = obj.finalAreaFunction;

                const interp = DSPUtils.interp1(xSrc, ySrc, xDst);
                logArea.set(interp);

              logArea[targetLength - 1] = 0;

            const lines = text.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);

              const m1 = lines[0].match(/([0-9]+)\s*$/);

              if (m2) vtl = parseFloat(m2[1]);
              const tmpArea = [];
              for (let i = 3; i < Math.min(lines.length, 3 + nSec); i++) {
                const val = parseFloat(lines[i]);
                if (!isNaN(val)) tmpArea.push(Math.log(Math.max(val, 1e-12)));
              }
              if (tmpArea.length >= 2) {
                const nTargetSec = targetLength - 1;
                const xSrc = tmpArea.map((_, i) => i / (tmpArea.length - 1));
                const xDst = Array.from({ length: nTargetSec }, (_, i) => i / (nTargetSec - 1));
                const interp = DSPUtils.interp1(xSrc, tmpArea, xDst);
                for (let i = 0; i < nTargetSec; i++) logArea[i] = interp[i];

        }
      }
      VocalTractModel.WindowCoeff6T = new Float64Array([

        0.0726831633, 0.0125124215, 0.0007833203

      VocalTractModel.ModalPreset   = [0.4134, 0.5530, 0.0041, 0.5817];
      VocalTractModel.FryPreset     = [0.4808, 0.5955, 0.0269, 0.7200];
      VocalTractModel.BreathyPreset = [0.4621, 0.6604, 0.0270, 0.7712];
      
      /* ============================================================================
 * 2. CLASS 2: LFSourceModel (Analytical Antialiased L-F Source & Equalizers)
 * ============================================================================ */
      class LFSourceModel {
        static getCachedEqualizer() {
          if (!LFSourceModel.cachedEqStr) {
            LFSourceModel.cachedEqStr = LFSourceModel.equalizerDesignAAFX(
              VocalTractModel.WindowCoeff6T, 68, 80, 1.5
            );
          }
          return LFSourceModel.cachedEqStr;
        }
        
        static synthesizeFromF0Trajectory(f0In, timeAxis, fs, tp, te, ta, tc, jitterSD = 0, shimmerSD = 0, perturbation = "gaussian") {
          const t0 = timeAxis[0], tEnd = timeAxis[timeAxis.length - 1];
          const nSamples = Math.floor((tEnd - t0) * fs) + 1;
          const tt = new Float64Array(nSamples);
          for (let i = 0; i < nSamples; i++) tt[i] = t0 + i / fs;
          
          const logF0In = new Float64Array(f0In.length);
          for (let i = 0; i < f0In.length; i++) logF0In[i] = Math.log(Math.max(f0In[i], 1e-12));
          const interpLogF0 = DSPUtils.interp1(timeAxis, logF0In, tt);
          const f0 = new Float64Array(nSamples);
          for (let i = 0; i < nSamples; i++) f0[i] = Math.exp(interpLogF0[i]);
          
          const pvPhase = new Float64Array(nSamples);
          let theta = 0.0;
          const twoPiOverFs = (2.0 * Math.PI) / fs;
          for (let i = 0; i < nSamples; i++) {
            theta += twoPiOverFs * f0[i];
            pvPhase[i] = Math.atan2(Math.sin(theta), Math.cos(theta));
          }
          
          const startPointList = [];
          for (let i = 0; i < nSamples - 1; i++) {
            if (pvPhase[i + 1] - pvPhase[i] < -5.0) startPointList.push(i);
          }
          
          const outSignal = new Float64Array(nSamples);
          const directOut = new Float64Array(nSamples);
          const directVV  = new Float64Array(nSamples);
          const Tw = 4.0 / fs;
          
          const modelParam = LFSourceModel.generateLFmodelParameter(tp, te, ta, tc);
          
          let lastPoint = 0;
          for (let ii = 0; ii < startPointList.length - 2; ii++) {
            const p0 = lastPoint + 1;
            const p1 = startPointList[ii];
            const p2 = startPointList[ii + 1];
            const p3 = startPointList[ii + 2];
            const spanLen = p3 - p0 + 1;
            if (spanLen <= 0) continue;
            
            const normalizedTime = new Float64Array(spanLen);
            const jitterOffset = jitterSD * LFSourceModel.perturbationFunction(perturbation);
            let k = 0;
            for (let idx = p0; idx <= p1; idx++, k++) {
              normalizedTime[k] = (pvPhase[idx] - Math.PI) / (2.0 * Math.PI) + jitterOffset;
            }
            for (let idx = p1 + 1; idx <= p2; idx++, k++) {
              normalizedTime[k] = (pvPhase[idx] + Math.PI) / (2.0 * Math.PI) + jitterOffset;
            }
            for (let idx = p2 + 1; idx <= p3; idx++, k++) {
              normalizedTime[k] = (pvPhase[idx] + 3.0 * Math.PI) / (2.0 * Math.PI) + jitterOffset;
            }
            
            let sumF0 = 0.0;
            const nMid = p2 - p1;
            for (let idx = p1 + 1; idx <= p2; idx++) sumF0 += f0[idx];
            const averageF0 = nMid > 0 ? sumF0 / nMid : f0[p1];
            const TwNormalized = Tw * averageF0;
            
            const modelOut = LFSourceModel.generateAALFmodelOut(normalizedTime, modelParam, TwNormalized);
            const shimmerGain = 1.0 + shimmerSD * LFSourceModel.perturbationFunction(perturbation);
            
            for (let j = 0; j < spanLen; j++) {
              const destIdx = p0 + j;
              outSignal[destIdx] += modelOut.antiAliasedSource[j] * shimmerGain;
              directOut[destIdx] += modelOut.source[j];
              directVV[destIdx]  += modelOut.volumeVerocity[j];
            }
            lastPoint = p1;
          }
          
          const eqStr = LFSourceModel.getCachedEqualizer();
          const a = eqStr.iirCoefficient;
          let sumA = 0.0;
          for (let i = 0; i < a.length; i++) sumA += a[i];
          const bIIR = new Float64Array([0.0, 0.0, sumA]);
          const yfix = DSPUtils.filter(bIIR, a, outSignal);
          
          return {
            antiAliasedSignal: yfix,
            antiAliasedOnly:   outSignal,
            LFmodelOut:        directOut,
            LFvolumeVelocity:  directVV,
            samplingFrequency: fs,
            f0Interpolated:    f0,
            temporalPosition:  tt
          };
        }
        
        static sourceByLFmodelAAF6T(timeAxis, tp, te, ta, tc, Tworg) {
          const modelParameter = LFSourceModel.generateLFmodelParameter(tp, te, ta, tc);
          return LFSourceModel.generateAALFmodelOut(timeAxis, modelParameter, Tworg);
        }
        
        static generateLFmodelParameter(tp, te, ta, tc) {
          const fg = 1.0 / (2.0 * tp);
          const omegaG = 2.0 * Math.PI * fg;
          
          const decayFun = (x) => ta * x - 1.0 + Math.exp(-x * (tc - te));
          const betaa = DSPUtils.fzero(decayFun, 1.0 / Math.max(ta, 1e-9));
          
          const sinWgTe = Math.sin(omegaG * te);
          const cosWgTe = Math.cos(omegaG * te);
          const closingAreaTerm = ((tc - te) * Math.exp(-betaa * (tc - te)) - ta) / (betaa * ta);
          
          const growthFun = (x) => {
            const num = -(x * sinWgTe - omegaG * cosWgTe + Math.exp(-x * te) * omegaG);
            const den = (x * x + omegaG * omegaG) * sinWgTe;
            return num / den + closingAreaTerm;
          };
          const alphaa = DSPUtils.fzero(growthFun, 2.0);
          
          return { omegaG, betaa, alphaa, te, tp, ta, tc };
        }
        
        static generateAALFmodelOut(timeAxis, modelParameter, two) {
          const N = timeAxis.length;
          const margin = two * 2.0;
          const { te, ta, tc, alphaa, omegaG, betaa } = modelParameter;
          
          const source = new Float64Array(N);
          const vv     = new Float64Array(N);
          
          const sinWgTe = Math.sin(omegaG * te);
          const cosWgTe = Math.cos(omegaG * te);
          const cf = -Math.exp(-alphaa * te) / sinWgTe;
          const denomOpen = (alphaa * alphaa + omegaG * omegaG) * sinWgTe;
          const boundaryVV = -(alphaa * sinWgTe - omegaG * cosWgTe + omegaG * Math.exp(-alphaa * te)) / denomOpen;
          const expBetaTcTe = Math.exp(-betaa * (tc - te));
          
          const idxOpenList = [];
          const pieceOpenList = [];
          const idxCloseList = [];
          const pieceCloseList = [];
          
          for (let i = 0; i < N; i++) {
            const t = timeAxis[i];
            if (t > 0 && t < te) {
              source[i] = cf * Math.exp(alphaa * t) * Math.sin(omegaG * t);
              vv[i] = -(alphaa * Math.sin(omegaG * t) - omegaG * Math.cos(omegaG * t) + omegaG * Math.exp(-alphaa * t)) / denomOpen;
            } else if (t >= te && t < tc) {
              const dt = t - te;
              source[i] = (-1.0 / (betaa * ta)) * (Math.exp(-betaa * dt) - expBetaTcTe);
              const closeVV = (dt * expBetaTcTe) / (betaa * ta) + (Math.exp(-betaa * dt) - 1.0) / (betaa * betaa * ta);
              vv[i] = closeVV + boundaryVV;
            }
            
            if (t > -margin && t < te + margin) {
              idxOpenList.push(i);
              pieceOpenList.push(t / te);
            }
            if (t >= te - margin && t < tc + margin) {
              idxCloseList.push(i);
              pieceCloseList.push((t - te) / (tc - te));
            }
          }
          
          const antialiasedSignal = new Float64Array(N);
          
          if (idxOpenList.length > 0) {
            const pieceOpen = new Float64Array(pieceOpenList);
            const twOpen = two / te;
            const cExpOpen = LFSourceModel.antiAliasedCExponentialSegment(alphaa * te, omegaG * te, pieceOpen, twOpen);
            for (let k = 0; k < idxOpenList.length; k++) {

            }
          }
          
          if (idxCloseList.length > 0) {
            const pieceClose = new Float64Array(pieceCloseList);
            const twClose = two / (tc - te);
            const betaClose = -betaa * (tc - te);
            const cExpClose = LFSourceModel.antiAliasedCExponentialSegment(betaClose, 0.0, pieceClose, twClose);
            const tmpPoly   = LFSourceModel.antiAliasedPolynomialSegmentR([1.0, 0.0], pieceClose, twClose);
            const scaleClose = 1.0 / (betaa * ta);
            const expB = Math.exp(betaClose);
            
            for (let k = 0; k < idxCloseList.length; k++) {
              const outCloseExp  = -cExpClose.re[k] * scaleClose;

              antialiasedSignal[idxCloseList[k]] += outCloseExp + outClosePoly;
            }
          }
          
          return {
            source,
            antialiasedSignal,
            antiAliasedSource: antialiasedSignal,
            volumeVerocity: vv
          };
        }
        
        static antiAliasedCExponentialSegment(betRe, betIm, tt, two) {
          const tw = two * 1.5;
          const alph = Math.PI / tw;
          const aa = VocalTractModel.WindowCoeff6T;
          const M = aa.length;
          
          const betSqRe = betRe * betRe - betIm * betIm;
          const betSqIm = 2.0 * betRe * betIm;
          const wRe = new Float64Array(M);
          const wIm = new Float64Array(M);
          const kAlphArr = new Float64Array(M);
          const altSign  = new Float64Array(M);
          
          for (let k = 0; k < M; k++) {
            const ka = k * alph;
            kAlphArr[k] = ka;
            altSign[k] = (k % 2 === 0) ? 1.0 : -1.0;
            const dRe = ka * ka + betSqRe;
            const dIm = betSqIm;
            const dMagSq = dRe * dRe + dIm * dIm;
            wRe[k] = (aa[k] * dRe) / dMagSq;
            wIm[k] = (-aa[k] * dIm) / dMagSq;
          }
          
          let sumAltWRe = 0.0, sumAltWIm = 0.0;
          for (let k = 0; k < M; k++) {
            sumAltWRe += altSign[k] * wRe[k];
            sumAltWIm += altSign[k] * wIm[k];
          }
          const betAltWRe = betRe * sumAltWRe - betIm * sumAltWIm;
          const betAltWIm = betRe * sumAltWIm + betIm * sumAltWRe;
          
          const ePosMag = Math.exp(betRe * tw), eNegMag = Math.exp(-betRe * tw);
          const dExpRe = ePosMag * Math.cos(betIm * tw) - eNegMag * Math.cos(-betIm * tw);
          const dExpIm = ePosMag * Math.sin(betIm * tw) - eNegMag * Math.sin(-betIm * tw);
          const intFactorRe = betAltWRe * dExpRe - betAltWIm * dExpIm;
          const intFactorIm = betAltWRe * dExpIm + betAltWIm * dExpRe;
          
          const expBetMag = Math.exp(betRe);
          const expBetRe  = expBetMag * Math.cos(betIm);
          const expBetIm  = expBetMag * Math.sin(betIm);
          
          const N = tt.length;
          const outRe = new Float64Array(N);
          const outIm = new Float64Array(N);
          const norm = 1.0 / (2.0 * tw * aa[0]);
          
          for (let i = 0; i < N; i++) {
            const t = tt[i];
            let accRe = 0.0, accIm = 0.0;
            
            if (t >= tw && t <= tw + 1.0) {
              const em = Math.exp(betRe * t);
              const er = em * Math.cos(betIm * t);
              const ei = em * Math.sin(betIm * t);
              accRe += er * intFactorRe - ei * intFactorIm;
              accIm += er * intFactorIm + ei * intFactorRe;
            }
            
            if (Math.abs(t) < tw) {
              let s1Re = 0.0, s1Im = 0.0;
              for (let k = 0; k < M; k++) {
                const ka = kAlphArr[k];
                const sinVal = Math.sin(t * ka) * ka;
                const cosVal = Math.cos(t * ka);
                const termRe = sinVal - cosVal * betRe;
                const termIm = -cosVal * betIm;
                s1Re += termRe * wRe[k] - termIm * wIm[k];
                s1Im += termRe * wIm[k] + termIm * wRe[k];
              }
              const em = Math.exp(betRe * (t + tw));
              const er = em * Math.cos(betIm * (t + tw));
              const ei = em * Math.sin(betIm * (t + tw));
              s1Re += er * betAltWRe - ei * betAltWIm;
              s1Im += er * betAltWIm + ei * betAltWRe;
              accRe += s1Re;
              accIm += s1Im;
            }
            
            if (Math.abs(1.0 - t) <= tw) {
              const dt = t - 1.0;
              let trigRe = 0.0, trigIm = 0.0;
              for (let k = 0; k < M; k++) {
                const ka = kAlphArr[k];
                const sinVal = Math.sin(dt * ka) * ka;
                const cosVal = Math.cos(dt * ka);
                const termRe = sinVal - cosVal * betRe;
                const termIm = -cosVal * betIm;
                trigRe += termRe * wRe[k] - termIm * wIm[k];
                trigIm += termRe * wIm[k] + termIm * wRe[k];
              }
              let s3Re = expBetRe * trigRe - expBetIm * trigIm;
              let s3Im = expBetRe * trigIm + expBetIm * trigRe;
              
              const em = Math.exp(betRe * (tw + t));
              const er = em * Math.cos(betIm * (tw + t));
              const ei = em * Math.sin(betIm * (tw + t));
              s3Re += er * betAltWRe - ei * betAltWIm;
              s3Im += er * betAltWIm + ei * betAltWRe;
              
              accRe -= s3Re;
              accIm -= s3Im;
            }
            
            outRe[i] = accRe * norm;
            outIm[i] = accIm * norm;
          }
          return { re: outRe, im: outIm };
        }
        
        static antiAliasedPolynomialSegmentR(poly_coeff, tt, two) {
          const tw = two * 1.5;
          const hcRaw = VocalTractModel.WindowCoeff6T;
          const m = hcRaw.length - 1;
          const hc = new Float64Array(hcRaw.length);
          const norm = 1.0 / (2.0 * tw * hcRaw[0]);
          for (let i = 0; i < hcRaw.length; i++) hc[i] = hcRaw[i] * norm;
          
          const n = poly_coeff.length - 1;
          const C = Array.from({ length: n + 1 }, () => new Float64Array(m));
          const S = Array.from({ length: n + 1 }, () => new Float64Array(m));
          const U = Array.from({ length: n + 1 }, () => new Float64Array(n + 2));
          const V = Array.from({ length: n + 1 }, () => new Float64Array(n + 1));
          
          const altSignM = new Float64Array(m);
          for (let k = 1; k <= m; k++) altSignM[k - 1] = (k % 2 === 1) ? -1.0 : 1.0;
          
          const negTwPow  = new Float64Array(n + 1);
          const posTwPowU = new Float64Array(n + 2);
          const posTwPowV = new Float64Array(n);
          for (let j = 1; j <= n + 1; j++) negTwPow[j - 1] = Math.pow(-tw, j);
          for (let j = 0; j <= n + 1; j++) posTwPowU[j] = Math.pow(tw, j);
          for (let j = 1; j <= n; j++) posTwPowV[j - 1] = Math.pow(tw, j);
          
          for (let k = 1; k <= m; k++) S[0][k - 1] = (tw / (k * Math.PI)) * hc[k];
          U[0][1] = hc[0];
          let dotNeg = 0.0;
          for (let j = 1; j <= n + 1; j++) dotNeg += U[0][j] * negTwPow[j - 1];
          U[0][0] = -dotNeg;
          V[0][0] = 1.0;
          
          for (let r = 1; r <= n; r++) {
            for (let k = 1; k <= m; k++) {
              const scaleK = (r * tw) / (k * Math.PI);
              C[r][k - 1] = -scaleK * S[r - 1][k - 1];
              S[r][k - 1] =  scaleK * C[r - 1][k - 1];
            }
            let uNegDot = 0.0;
            for (let j = 1; j <= n + 1; j++) {
              U[r][j] = (r / j) * U[r - 1][j - 1];
              uNegDot += U[r][j] * negTwPow[j - 1];
            }
            let cAltDot = 0.0;
            for (let k = 0; k < m; k++) cAltDot += C[r][k] * altSignM[k];
            U[r][0] = -(uNegDot + cAltDot);
            
            let vPosDot = 0.0;
            for (let j = 1; j <= n; j++) {
              V[r][j] = (r / j) * V[r - 1][j - 1];
              vPosDot += V[r][j] * posTwPowV[j - 1];
            }
            let uPosDot = 0.0;
            for (let j = 0; j <= n + 1; j++) uPosDot += U[r][j] * posTwPowU[j];
            V[r][0] = cAltDot + uPosDot - vPosDot;
          }
          
          const B = Array.from({ length: n + 1 }, () => new Float64Array(n + 1));
          for (let ii = 0; ii <= n; ii++) {
            B[ii][0] = 1.0;
            for (let jj = 1; jj <= ii; jj++) {
              B[ii][jj] = B[ii - 1][jj - 1] + B[ii - 1][jj];
            }
          }
          
          const pRow = poly_coeff;
          const pRowB = new Float64Array(n + 1);
          for (let j = 0; j <= n; j++) {
            let s = 0.0;
            for (let i = 0; i <= n; i++) s += pRow[i] * B[i][j];
            pRowB[j] = s;
          }
          
          const mulRowMat = (row, mat, cols) => {
            const res = new Float64Array(cols);
            for (let c = 0; c < cols; c++) {
              let s = 0.0;
              for (let r = 0; r <= n; r++) s += row[r] * mat[r][c];
              res[c] = s;
            }
            return res;
          };
          
          const c0 = mulRowMat(pRow, C, m);
          const s0 = mulRowMat(pRow, S, m);
          const u0 = mulRowMat(pRow, U, n + 2);
          const v  = mulRowMat(pRow, V, n + 1);
          const c1 = mulRowMat(pRowB, C, m);
          const s1 = mulRowMat(pRowB, S, m);
          const u1 = mulRowMat(pRowB, U, n + 2);
          
          const N = tt.length;
          const output = new Float64Array(N);
          const piOverTw = Math.PI / tw;
          
          for (let i = 0; i < N; i++) {
            const t = tt[i];
            if (t > -tw && t <= tw) {
              let g1 = 0.0;
              for (let k = 1; k <= m; k++) {
                const ang = piOverTw * t * k;
                g1 += Math.cos(ang) * c0[k - 1] + Math.sin(ang) * s0[k - 1];
              }
              let tPow = 1.0;
              for (let j = 0; j <= n + 1; j++) {
                g1 += tPow * u0[j];
                tPow *= t;
              }
              output[i] += g1;
            }
            if (t > tw && t <= 1.0 - tw) {
              let g2 = 0.0, tPow = 1.0;
              for (let j = 0; j <= n; j++) {
                g2 += tPow * v[j];
                tPow *= t;
              }
              output[i] += g2;
            }
            if (t > 1.0 - tw && t <= 1.0 + tw) {
              const dt = t - 1.0;
              let trig = 0.0;
              for (let k = 1; k <= m; k++) {
                const ang = piOverTw * dt * k;
                trig += Math.cos(ang) * c1[k - 1] + Math.sin(ang) * s1[k - 1];
              }
              let dtPow = 1.0;
              for (let j = 0; j <= n + 1; j++) {
                trig += dtPow * u1[j];
                dtPow *= dt;
              }
              if (tw > 1.0 - tw) {
                output[i] -= trig;
              } else {
                let polyV = 0.0, tPow = 1.0;
                for (let j = 0; j <= n; j++) {
                  polyV += tPow * v[j];
                  tPow *= t;
                }
                output[i] += polyV - trig;
              }
            }
            if (tw > 1.0 - tw && t > tw && t <= 1.0 + tw) {
              let polyV = 0.0, tPow = 1.0;
              for (let j = 0; j <= n; j++) {
                polyV += tPow * v[j];
                tPow *= t;
              }
              output[i] += polyV;
            }
          }
          return output;
        }
        
        static equalizerDesignAAFX(cosineCoefficient, upperLimit, halfSample, scale = 1.0) {
          const fs = 8000;
          const Tw = 4.0 / fs;
          const fftl = 4096;
          const ak = cosineCoefficient;
          const M = ak.length;
          
          const sinc = (x) => Math.abs(x) < 1e-12 ? 1.0 : Math.sin(Math.PI * x) / (Math.PI * x);
          const hh = new Float64Array(fftl);
          
          for (let i = 0; i < fftl; i++) {
            let fx = (i / fftl) * fs;
            if (fx > fs / 2.0) fx -= fs;
            const omg = 2.0 * Math.PI * fx * scale;
            const base = (omg * Tw) / Math.PI;
            let s = 0.0;
            for (let k = 0; k < M; k++) {
              s += (sinc(base + k) + sinc(base - k)) * ak[k];
            }
            hh[i] = s / (2.0 * ak[0]);
          }
          hh[0] = 1.0;
          
          const hhdd = new Float64Array(fftl);
          for (let i = 0; i <= fftl / 2; i++) hhdd[i] = Math.abs(hh[i]);
          for (let i = 1; i < fftl / 2; i++) hhdd[fftl - i] = hhdd[i];
          
          const maxG = Math.pow(10.0, upperLimit / 20.0);
          const ggRe = new Float64Array(fftl);
          for (let i = 0; i < fftl; i++) {
            ggRe[i] = Math.min(maxG, 1.0 / Math.max(hhdd[i], 1e-15));
          }
          
          const ihhRe = new Float64Array(ggRe);
          const ihhIm = new Float64Array(fftl);
          DSPUtils.fft(ihhRe, ihhIm, true);
          
          const hl = halfSample;
          const ww = VocalTractModel.nuttallwin12(2 * hl + 1);
          const eqqh = new Float64Array(2 * hl + 1);
          let sumEqqh = 0.0;
          for (let k = -hl; k <= hl; k++) {
            const idx = (k + fftl) % fftl;
            const val = ihhRe[idx] * ww[k + hl];
            eqqh[k + hl] = val;
            sumEqqh += val;
          }
          for (let i = 0; i < eqqh.length; i++) eqqh[i] /= sumEqqh;
          
          const cepRe = new Float64Array(fftl);
          const cepIm = new Float64Array(fftl);
          for (let i = 0; i < fftl; i++) cepRe[i] = Math.log(ggRe[i]);
          DSPUtils.fft(cepRe, cepIm, true);
          
          for (let i = 1; i < fftl / 2; i++) { cepRe[i] *= 2.0; cepIm[i] *= 2.0; }
          for (let i = fftl / 2 + 1; i < fftl; i++) { cepRe[i] = 0.0; cepIm[i] = 0.0; }
          DSPUtils.fft(cepRe, cepIm, false);
          for (let i = 0; i < fftl; i++) {
            const em = Math.exp(cepRe[i]);
            const ang = cepIm[i];
            cepRe[i] = em * Math.cos(ang);
            cepIm[i] = em * Math.sin(ang);
          }
          DSPUtils.fft(cepRe, cepIm, true);
          const mmResp = cepRe;
          
          const hl2 = Math.round(hl * 1.36);
          const ww2 = VocalTractModel.nuttallwin12(2 * hl2 + 1);
          const minPhaseW = new Float64Array(hl2 + 1);
          let sumMinP = 0.0;
          for (let i = 0; i <= hl2; i++) {
            minPhaseW[i] = mmResp[i] * ww2[hl2 + i];
            sumMinP += minPhaseW[i];
          }
          for (let i = 0; i <= hl2; i++) minPhaseW[i] /= sumMinP;
          
          const eqRe = new Float64Array(fftl);
          const eqIm = new Float64Array(fftl);
          for (let i = 0; i < eqqh.length; i++) eqRe[i] = eqqh[i];
          DSPUtils.fft(eqRe, eqIm, false);
          for (let i = 0; i < fftl; i++) {
            eqRe[i] = eqRe[i] * eqRe[i] + eqIm[i] * eqIm[i];
            eqIm[i] = 0.0;
          }
          DSPUtils.fft(eqRe, eqIm, true);
          const r = new Float64Array(7);
          for (let i = 0; i < 7; i++) r[i] = eqRe[i] / eqRe[0];
          const a = DSPUtils.levinson(r);
          
          return {
            response: eqqh,
            iirCoefficient: a,
            minimumPhaseResponseW: minPhaseW
          };
        }
        
        static perturbationFunction(perturbation = "gaussian") {
          LFSourceModel.perturbationState++;
          switch (perturbation) {
            case "gaussian": {
              const u1 = Math.max(Math.random(), 1e-12);
              const u2 = Math.random();
              return Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            }
            case "P0MRandom":
            return Math.round((Math.random() - 0.5) * 2.9999);
            case "Alteration":
            return 1 - 2 * (LFSourceModel.perturbationState % 2);
            default:
            return 0.0;
          }
        }
      }
      LFSourceModel.cachedEqStr = null;
      LFSourceModel.perturbationState = 0;
      
      /* ============================================================================

        recomputeCompositeBasis() {
          const N = this.NSection + 1;
          let maxAbs = 0.0;
          for (let r = 0; r < N; r++) {
            let s = 0.0;
            for (let c = 0; c < 7; c++) s += this.ModifierBasis[c][r] * this.CoefficientList[c];
            this.ModifierComposite[r] = s;
            if (Math.abs(s) > maxAbs) maxAbs = Math.abs(s);
          }
          if (maxAbs > 1.0) {
            for (let r = 0; r < N; r++) this.ModifierComposite[r] /= maxAbs;
          }
        }

              for (let i = 0; i < this.MonitoredSound.length; i++) {
                if (Math.abs(this.MonitoredSound[i]) > maxAbs) maxAbs = Math.abs(this.MonitoredSound[i]);
              }
              const norm = new Float64Array(this.MonitoredSound.length);
              const g = maxAbs > 0 ? 0.95 / maxAbs : 1.0;
              for (let i = 0; i < norm.length; i++) norm[i] = this.MonitoredSound[i] * g;
              DSPUtils.playSignal(norm, this.SamplingFrequency);
            }
